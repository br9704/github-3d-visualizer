<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="github universe">
  <!-- SIGNAL palette only: warm black ground, one amber accent. No gradient,
       no shadow, 2px corner radius — the same rules the CSS guards enforce. -->
  <rect width="32" height="32" rx="2" fill="#050505"/>
  <!-- A node, drawn the way the app draws them: an icosahedron silhouette with
       its facet structure showing. Filled rather than outlined so it still
       reads as a solid object at 16px. -->
  <path d="M16 5 L25.5 10.5 L25.5 21.5 L16 27 L6.5 21.5 L6.5 10.5 Z" fill="#ffb000"/>
  <g stroke="#050505" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M16 5 L16 27"/>
    <path d="M6.5 10.5 L25.5 21.5"/>
    <path d="M25.5 10.5 L6.5 21.5"/>
  </g>
</svg>
